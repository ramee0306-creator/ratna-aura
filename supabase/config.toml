# Supabase CLI settings for this project.
# Link to your online project with:  npx supabase link --project-ref <your-project-ref>
project_id = "ratna-aura"

# Our functions check the login token themselves (see _shared/supabase.ts),
# which works with both the old and the new Supabase key formats.
[functions.birth-profiles]
verify_jwt = false

[functions.delete-account]
verify_jwt = false

[functions.kundli]
verify_jwt = false
# The Swiss Ephemeris WebAssembly engine, copied here by "npm run sync-shared".
static_files = ["./functions/kundli/swiss_eph.wasm"]

[functions.panchang]
verify_jwt = false
static_files = ["./functions/panchang/swiss_eph.wasm"]

[functions.rashifal]
verify_jwt = false
static_files = ["./functions/rashifal/swiss_eph.wasm"]
