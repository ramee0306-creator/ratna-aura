# Builds the signed Android App Bundle (.aab) to upload to Google Play (Milestone 9).
# Start it from GitHub → Actions → "Build for Google Play" → Run workflow. Download the .aab from the run's
# Artifacts and upload it in Play Console → your app → Testing / Production → Create new release.
#
# Needs these repository secrets (Settings → Secrets and variables → Actions); see README → Publishing:
#   ANDROID_UPLOAD_KEYSTORE_BASE64   your upload key file (.jks), base64-encoded
#   ANDROID_UPLOAD_STORE_PASSWORD    its store password
#   ANDROID_UPLOAD_KEY_ALIAS         its key alias (e.g. upload)
#   ANDROID_UPLOAD_KEY_PASSWORD      its key password
# Optional repository VARIABLE (Settings → Secrets and variables → Actions → Variables):
#   REVENUECAT_ANDROID_KEY           RevenueCat's public Android SDK key (turns on Google Play purchases)
name: Build for Google Play

on:
  workflow_dispatch:

concurrency: build-aab

env:
  # PUBLIC by design (inside every copy of the app); the database is protected by its security rules.
  EXPO_PUBLIC_SUPABASE_URL: https://rthnktnardwvpngivlpg.supabase.co
  EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_CKtaMD3h3I-O_1MbvXg3AA_nkjndLDv
  EXPO_PUBLIC_DEMO_MODE: '0'
  EXPO_PUBLIC_REVENUECAT_ANDROID_KEY: ${{ vars.REVENUECAT_ANDROID_KEY }}
  # Every upload to Google Play needs a higher version code: use this workflow's run number (+100).
  ANDROID_VERSION_CODE: ${{ github.run_number }}00

jobs:
  aab:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check the signing secrets are set
        env:
          KEYSTORE: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::error::Add the ANDROID_UPLOAD_* secrets first (README → Publishing → Upload key)."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - run: npm run check
      - name: Prepare the Android project
        working-directory: app
        run: npx expo prebuild --platform android --no-install
      - name: Unpack the upload key
        env:
          KEYSTORE: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/upload.jks"
      - name: Build the signed App Bundle
        working-directory: app/android
        env:
          ORG_GRADLE_PROJECT_RATNA_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          ORG_GRADLE_PROJECT_RATNA_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_RATNA_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: ./gradlew bundleRelease --no-daemon -PRATNA_UPLOAD_STORE_FILE="$RUNNER_TEMP/upload.jks"
      - name: Name the file
        run: cp app/android/app/build/outputs/bundle/release/app-release.aab "ratna-aura-${ANDROID_VERSION_CODE}.aab"
      - uses: actions/upload-artifact@v4
        with:
          name: ratna-aura-aab
          path: ratna-aura-*.aab
          retention-days: 30
      - name: Remove the key file
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"
