# Deploys the server (Supabase database changes + server functions) whenever
# server code changes on main. It can also be started by hand from the
# GitHub "Actions" tab ("Run workflow").
#
# One-time set-up (GitHub → repository → Settings → Secrets and variables → Actions):
#   secret SUPABASE_ACCESS_TOKEN  – from supabase.com → Account → Access Tokens
#   secret SUPABASE_DB_PASSWORD   – the database password chosen when the project was created
name: Deploy server

on:
  push:
    branches: [main]
    paths:
      - 'supabase/**'
      - 'packages/kundli/**'
      - 'scripts/sync-shared.mjs'
      - '.github/workflows/deploy-server.yml'
  workflow_dispatch:

concurrency: deploy-server

env:
  # The project's ID (also part of its public URL) — not a secret.
  PROJECT_REF: rthnktnardwvpngivlpg
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check the secrets are set
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::Add SUPABASE_ACCESS_TOKEN and SUPABASE_DB_PASSWORD under Settings → Secrets and variables → Actions."
            exit 1
          fi

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Never deploy code that fails its tests.
      - run: npm test

      # Copy the kundli logic and the Swiss Ephemeris engine into supabase/functions.
      - run: npm run sync-shared

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link the project
        run: supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      # The very first migration was run by hand in the dashboard's SQL editor,
      # so record it as already applied (does nothing if it already is).
      - name: Record the first migration
        run: supabase migration repair 20261018000001 --status applied --password "$SUPABASE_DB_PASSWORD"

      - name: Apply database changes
        run: supabase db push --password "$SUPABASE_DB_PASSWORD"

      - name: Deploy server functions
        run: supabase functions deploy --project-ref "$PROJECT_REF"
