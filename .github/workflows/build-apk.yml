# Builds an Android APK you can install directly on a phone (Milestone 8). No Expo or Google account needed:
# GitHub's own computers build it. Start it from GitHub → Actions → "Build APK" → Run workflow, then download
# the APK from the finished run (Artifacts → ratna-aura-apk), unzip it and open the .apk on your phone.
#
# The APK is signed with a TEST key, so it is for testing only. The Google Play version (AAB) is made by
# build-aab.yml with your own upload key.
name: Build APK

on:
  workflow_dispatch:

concurrency: build-apk

env:
  # These two values are PUBLIC by design (they are inside every copy of the app anyway).
  # The database is protected by its security rules, not by hiding these.
  EXPO_PUBLIC_SUPABASE_URL: https://rthnktnardwvpngivlpg.supabase.co
  EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_CKtaMD3h3I-O_1MbvXg3AA_nkjndLDv
  EXPO_PUBLIC_DEMO_MODE: '0'
  # Optional: RevenueCat's public Android key (repository variable) turns on Google Play purchases.
  EXPO_PUBLIC_REVENUECAT_ANDROID_KEY: ${{ vars.REVENUECAT_ANDROID_KEY }}

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      # Never build an app that fails its tests.
      - run: npm run check
      # Generate the native Android project from app.config.ts (it is not stored in Git).
      - name: Prepare the Android project
        working-directory: app
        run: npx expo prebuild --platform android --no-install
      - name: Build the APK
        working-directory: app/android
        # Only modern 64-bit phones (almost all phones in use), so the test build is quicker.
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a
      - name: Name the file
        run: cp app/android/app/build/outputs/apk/release/app-release.apk "ratna-aura-${GITHUB_SHA::7}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: ratna-aura-apk
          path: ratna-aura-*.apk
          retention-days: 30
