# Publishes the privacy policy and terms of use (docs/*.md) as web pages with GitHub Pages:
# https://ramee0306-creator.github.io/ratna-aura/privacy.html and …/terms.html (the links Google Play needs).
# One-time setup: repository Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Publish policy pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/privacy-policy.md'
      - 'docs/terms-of-use.md'
      - 'docs/refund-policy.md'
      - 'docs/delete-account.md'
      - 'scripts/make-site.mjs'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency: pages

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, so each page's effective date is the day its document last changed.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/make-site.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
